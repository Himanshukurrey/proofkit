[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofkit"
version = "0.1.0"
description = "Catch false \"I fixed it\" claims from AI coding agents — capture a bug once, verify the fix anywhere."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Himanshu Kurrey", email = "himanshu98kurrey@gmail.com" },
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/Himanshukurrey/proofkit"
Issues = "https://github.com/Himanshukurrey/proofkit/issues"

[project.scripts]
proofkit = "proofkit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/proofkit"]

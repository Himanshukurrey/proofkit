[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofkit"
version = "0.2.0"
description = "Catch false \"I fixed it\" claims from AI coding agents — capture a bug once, verify the fix anywhere."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Himanshu Kurrey", email = "himanshu98kurrey@gmail.com" },
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Himanshukurrey/proofkit"
Issues = "https://github.com/Himanshukurrey/proofkit/issues"

[project.scripts]
proofkit = "proofkit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/proofkit"]

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
# Deliberately curated, not "ALL" — E/F/I catch real mistakes (unused
# imports, undefined names, import order); UP keeps syntax modern without
# breaking the py39 floor. Skipped DTZ (datetime timezone-awareness) and
# FA (future-annotations) as too pedantic for this codebase's actual needs
# right now — reconsider if the project grows.
select = ["E", "F", "I", "UP"]
